name: Draft blog post

# Draft every 2 days for review. Saves straight to Vercel Blob as an
# unpublished draft (draft: true) — it shows up in /admin under "Pending
# review", where publishing or discarding it is the approval gate. Also
# runnable on demand from the Actions tab.
# ponytail: cron has no native "every N days" — day-of-month */2 is the
# standard way to express it, at the cost of two runs landing back-to-back
# across a month boundary (e.g. the 31st then the 1st) a few times a year.
on:
  schedule:
    - cron: "0 13 */2 * *" # Every 2 days, 13:00 UTC
  workflow_dispatch:

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: npm run blog:draft
